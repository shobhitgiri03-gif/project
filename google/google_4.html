<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>google 4</title>
</head>
<style> 
    body {
        background: #000000;
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
    }
    h1 {
        color: #a1a1a1;
        font-size: 36px;
    }
    h3 {
        color: #fff9f9;
        font-size: 24px;
    }
    table {
        margin: 0 auto;
        border-collapse: collapse;
    }
    td {
        padding: 10px;
    }
    label {
        display: block;
        margin-bottom: 5px;
    }
    select, input[type="number"] {
        width: 200px;
        padding: 5px;
        font-size: 16px;
    }
    label {
        color: #fff9f9;
    }
    button {
        color: #000000;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }   
    </style>    
<body>
    <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo">    
    <h1>Create a strong password</h1>
    <h3>Use 8 or more characters with a mix of letters, numbers & symbols</h3>
    <form action="https://accounts.google.com/signup/v2/webcreateaccount" method="post">
        <input type="password" name="password" placeholder="Password" required>
        <br><br>
        <input type="password" name="confirmPassword" placeholder="Confirm" required>
        <br><br>
        <button type="submit">submit</button> 
</body>
</html>
